<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Une petite surprise 🎉</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .photo {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 0 auto 40px;
            border-radius: 12px;
        }

        .content {
            max-width: 750px;
            margin: 0 auto;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 25px;
            color: #222222;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
            color: #444444;
            margin: 0 0 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 18px;
            }

            .photo {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img 
            src="photo.jpg" 
            alt="Photo"
            class="photo"
        >

        <section class="content">

            <h1>🎉 Une petite surprise</h1>

            <p>
                Ton texte viendra ici.
            </p>

            <p>
                Tu pourras écrire autant de texte que tu veux,
                avec plusieurs paragraphes si nécessaire.
            </p>

        </section>

    </main>

</body>
</html>
